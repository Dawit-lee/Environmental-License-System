# Secrets come only from env vars (see .env.example). No defaults for secrets.
spring:
  application:
    name: env-permit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/envpermit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  error:
    include-message: always # the UI shows our ResponseStatusException reasons (all user-facing Korean)

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
  # S3-compatible document store. S3_ENDPOINT set → MinIO (local); blank → AWS S3.
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:envpermit-documents}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
