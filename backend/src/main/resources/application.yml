# Secrets come only from env vars (see .env.example). No defaults for secrets.
spring:
  application:
    name: env-permit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/envpermit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  error:
    include-message: always # the UI shows our ResponseStatusException reasons (all user-facing Korean)

app:
  base-url: ${APP_BASE_URL:http://localhost:5182} # web app address used in mail links
  # Mail: SMTP_HOST set → real SMTP (STARTTLS); empty → mail is only logged. See README (Gmail app password).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
  corrective:
    default-days: 7 # 초과 조치 업무 기한 = 입력일 + N일
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
  # S3-compatible document store. S3_ENDPOINT set → MinIO (local); blank → AWS S3.
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:envpermit-documents}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  # ① AI obligation extraction. API keys are read only from env vars ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY (never in config).
  extraction:
    provider: ${EXTRACTION_PROVIDER:} # claude|gemini|openai; empty = first with a key set, in that order
    claude:
      model: ${CLAUDE_MODEL:claude-sonnet-5-5}
    gemini:
      model: ${GEMINI_MODEL:gemini-3.6-flash} # needs PDF input + structured output
      base-url: https://generativelanguage.googleapis.com
    openai:
      model: ${OPENAI_MODEL:gpt-6.1-terra} # needs PDF (input_file) + structured output
      base-url: https://api.openai.com
    preparer: ${EXTRACTION_PREPARER:CLAUDE_PDF_DIRECT} # swappable input step (design §3.2)
    stale-after: 30m # RUNNING older than this at startup → FAILED("중단됨")
  # ④ version diff matching (design §3.4). shortcut: guesses until the gold-set sweep (design §6.3) sets them
  revision:
    match:
      t-pair: 0.6    # same citation_key pair needs this text similarity
      t-suggest: 0.5 # leftover rows pair by similarity at or above this
