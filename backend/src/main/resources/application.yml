# Secrets come only from env vars (see .env.example). No defaults for secrets.
spring:
  application:
    name: env-permit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/envpermit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
