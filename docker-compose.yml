# Values come from .env (copy .env.example). Never commit .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: envpermit
      POSTGRES_USER: ${DB_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d envpermit"]
      interval: 2s
      retries: 30

  # S3-compatible document store for local dev (SeaweedFS; MinIO no longer ships public images).
  # The access/secret keys below become its admin login. The API creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/envpermit
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-envpermit-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAW_API_OC: ${LAW_API_OC:-} # 법제처 OC; empty = law search returns 503, rest of the app works
      # AI extraction: one provider per server. Empty EXTRACTION_PROVIDER = first with a key set (Claude, Gemini, OpenAI).
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # empty = Claude runs fail with a clear message
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
      # Mail: SMTP_HOST empty = log only. Gmail = smtp.gmail.com:587 (STARTTLS) + app password.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5182}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
  s3-data:
