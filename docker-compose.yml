# Values come from .env (copy .env.example). Never commit .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: envpermit
      POSTGRES_USER: ${DB_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d envpermit"]
      interval: 2s
      retries: 30

  # S3-compatible document store for local dev (SeaweedFS; MinIO no longer ships public images).
  # The access/secret keys below become its admin login. The API creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/envpermit
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-envpermit-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAW_API_OC: ${LAW_API_OC:-} # 법제처 OC; empty = law search returns 503, rest of the app works
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
  s3-data:
